<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishLens</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>PhishLens</h1>
      <p class="subtitle">Saved phishing analysis</p>
    </header>
    <section class="panel" aria-labelledby="create-heading">
      <h2 id="create-heading">Save an analysis</h2>
      <form id="create-form">
        <label for="create-subject">Subject <span class="muted">(optional)</span></label>
        <input id="create-subject" name="subject" maxlength="320" autocomplete="off">
        <label for="create-body">Email body <span class="required">(required)</span></label>
        <textarea id="create-body" name="body" maxlength="30000" rows="4" required></textarea>
        <button id="create-button" type="submit">Save analysis</button>
      </form>
    </section>
    <p id="crud-status" class="status hidden" role="status" aria-live="polite"></p>
    <section class="panel" aria-labelledby="history-heading">
      <h2 id="history-heading">Saved analyses</h2>
      <p id="loading">Loading analyses…</p>
      <p id="empty" class="hidden">No saved analyses yet.</p>
      <ul id="history-list" class="history-list"></ul>
    </section>
    <section id="detail-panel" class="panel hidden" aria-labelledby="detail-heading">
      <h2 id="detail-heading">Analysis details</h2>
      <div id="detail-content"></div>
      <form id="edit-form" class="subpanel hidden">
        <h3>Edit notes and feedback</h3>
        <label for="edit-notes">Notes</label>
        <textarea id="edit-notes" rows="3" maxlength="10000"></textarea>
        <label for="edit-feedback">Feedback</label>
        <select id="edit-feedback">
          <option value="none">No feedback</option>
          <option value="false_positive">False positive</option>
          <option value="false_negative">False negative</option>
        </select>
        <div class="actions">
          <button id="save-edit" type="submit">Save changes</button>
          <button id="cancel-edit" class="secondary" type="button">Cancel</button>
        </div>
      </form>
      <form id="delete-confirm" class="subpanel hidden" aria-labelledby="delete-heading">
        <h3 id="delete-heading">Delete this analysis?</h3>
        <p>Delete <strong id="delete-subject"></strong>? This cannot be undone.</p>
        <div class="actions">
          <button id="confirm-delete" class="danger" type="submit">Delete analysis</button>
          <button id="cancel-delete" class="secondary" type="button">Cancel</button>
        </div>
      </form>
    </section>
  </main>
  <script type="module" src="js/popup.js"></script>
</body>
</html>
