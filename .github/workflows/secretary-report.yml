name: DevOps Secretary
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  workflow_run:
    workflows: [CI, Secretary preview]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
  deployments: read
  issues: write
  pull-requests: write
# Serialize writers; metadata from an old event is refetched, never trusted as current.
concurrency:
  group: veriqo-secretary-reports
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read trusted control plane only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Gather evidence and update one bot-owned report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECRETARY_AI_ENABLED: ${{ vars.SECRETARY_AI_ENABLED }}
          SECRETARY_GEMINI_MODEL: ${{ vars.SECRETARY_GEMINI_MODEL }}
          SECRETARY_GEMINI_KEY: ${{ secrets.SECRETARY_GEMINI_KEY }}
        run: python -m scripts.secretary.report
