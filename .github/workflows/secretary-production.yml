name: Production evidence
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: veriqo-production-evidence
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-observer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify automatic production deploy and calculate metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RENDER_OBSERVER_API_KEY: ${{ secrets.RENDER_OBSERVER_API_KEY }}
        run: python -m scripts.secretary.production
      - name: Preserve metrics and incident draft
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Veriqo-Production-Evidence
          path: output/secretary-production/
          if-no-files-found: warn
          retention-days: 30
