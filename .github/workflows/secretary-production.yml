name: Production evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: veriqo-production-evidence
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-observer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify automatic production deploy and calculate metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RENDER_OBSERVER_API_KEY: ${{ secrets.RENDER_OBSERVER_API_KEY }}
        run: python -m scripts.secretary.production
      - name: Preserve metrics and incident draft
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Veriqo-Production-Evidence
          path: output/secretary-production/
          if-no-files-found: warn
          retention-days: 30
