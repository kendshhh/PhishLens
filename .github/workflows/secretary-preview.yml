name: Secretary preview
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: read
jobs:
  report-hosted-staging:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run is privileged, so always use trusted default-branch code.
      # This bridge only reads the completed CI job and publishes its result;
      # it has no Render, Neon, deployment or artifact-write credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Publish N/A or pre-staging failure; defer runtime result to trusted controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python -m scripts.secretary.hosted_status
