name: Secretary preview
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: read
  deployments: write
# Same lock as the old hosted-staging job during migration; deployment cannot overlap.
concurrency:
  group: phishlens-hosted-staging
  cancel-in-progress: false
  # Retain waiting deployments while keeping the shared staging service serialized.
  queue: max
jobs:
  assess:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.assess.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - id: assess
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.secretary.preview --assess
  preview:
    needs: assess
    if: needs.assess.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - name: Read trusted controller, never PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Deploy and verify exact eligible PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECRETARY_PREVIEW_ENABLED: ${{ vars.SECRETARY_PREVIEW_ENABLED }}
          SECRETARY_STAGING_DB_HOST: ${{ vars.SECRETARY_STAGING_DB_HOST }}
          SECRETARY_PRODUCTION_DB_HOST: ${{ vars.SECRETARY_PRODUCTION_DB_HOST }}
          RENDER_STAGING_API_KEY: ${{ secrets.RENDER_STAGING_API_KEY }}
        run: python -m scripts.secretary.preview
      - name: Preserve deployment and extension evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Veriqo-Staging-Extension
          path: output/secretary/
          if-no-files-found: warn
          retention-days: 7
