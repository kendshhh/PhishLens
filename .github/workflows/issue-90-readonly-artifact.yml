name: Issue 90 read-only staging evidence
run-name: Issue 90 read-only verification of live staging SHA
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/issue-90-readonly-artifact.yml'
permissions:
  contents: read
jobs:
  readonly-staging-artifact:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact live staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 14fd5de4d040e905c3aa4dcc75ac46938cd4fa79
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Build extension and record exact source identity
        env:
          SOURCE_COMMIT: 14fd5de4d040e905c3aa4dcc75ac46938cd4fa79
        run: python scripts/package_extension.py
      - name: Verify packaged extension identity and contents
        env:
          SOURCE_COMMIT: 14fd5de4d040e905c3aa4dcc75ac46938cd4fa79
        run: >-
          python scripts/verify_extension_package.py
          output/extension/PhishLens-Extension.zip
          output/extension/evidence.json
          --expected-source "$SOURCE_COMMIT"
      - name: Read current staging identity, readiness, and model
        env:
          STAGING_URL: https://phishlens-staging.onrender.com
          EXPECTED_BACKEND_SHA: 14fd5de4d040e905c3aa4dcc75ac46938cd4fa79
          EXPECTED_MODEL_SHA: a2f13c256dd46c3267263f8de8f4f822206c5b0ceda96658713e2523a7f9559c
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = os.environ['STAGING_URL'].rstrip('/')
          def get(path):
              request = Request(base + path, headers={
                  'Accept': 'application/json',
                  'Cache-Control': 'no-cache',
              })
              with urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path} returned HTTP {response.status}')
                  return json.load(response)

          version = get('/version')
          ready = get('/ready')
          model = get('/model-info')
          if version.get('commit') != os.environ['EXPECTED_BACKEND_SHA'] or version.get('environment') != 'staging':
              raise RuntimeError(f'Unexpected staging version identity: {version}')
          if ready.get('status') != 'ready' or ready.get('database') != 'connected':
              raise RuntimeError(f'Staging readiness check failed: {ready}')
          if model.get('provider_mode') != 'tfidf' or model.get('model_sha256') != os.environ['EXPECTED_MODEL_SHA'] or model.get('accepts_tfidf_reports') is not True:
              raise RuntimeError(f'TF-IDF model identity check failed: {model}')
          if model.get('accepts_local_reviews') is not True:
              raise RuntimeError(f'Local review acceptance check failed: {model}')
          evidence = {
              'recorded_at': dt.datetime.now(dt.UTC).isoformat(),
              'backend_source_commit': version['commit'],
              'extension_source_commit': os.environ['EXPECTED_BACKEND_SHA'],
              'environment': version['environment'],
              'version': version,
              'ready': ready,
              'model_info': model,
              'saved_analysis_crud_performed': False,
              'production_writes_performed': False,
          }
          output = Path('output/issue-90-readonly')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'staging-readonly-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, indent=2))
          PY
      - name: Upload exact-live-SHA package and read-only evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhishLens-Issue-90-ReadOnly-14fd5de4
          path: |
            output/extension/PhishLens-Extension.zip
            output/extension/evidence.json
            output/issue-90-readonly/staging-readonly-evidence.json
          if-no-files-found: error
          retention-days: 7
