name: Automatic labels
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: auto-labels-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read trusted default-branch labeler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify labeling rules
        run: node --test scripts/tests/auto_labels.test.mjs
      - name: Add matching existing labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/auto_labels.mjs
