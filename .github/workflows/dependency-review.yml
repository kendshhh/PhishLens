name: Dependency review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency review (advisory)
    # Run the advisory review by default; set the repository variable to
    # "false" only when dependency metadata is unavailable or the action is
    # intentionally disabled for the repository.
    if: vars.DEPENDENCY_REVIEW_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          warn-only: true
