name: Dependency security

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile-audit:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan repository for secrets with Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --gitleaks-ignore-path .gitleaksignore .

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Audit npm lockfile
        run: npm audit --audit-level=high --package-lock-only

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install pinned pip-audit
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      - name: Audit pinned Python runtime and development dependencies
        run: python -m pip_audit --no-deps -r backend/requirements-dev.txt

      - name: Audit optional AI inference dependencies with OSV
        run: >-
          python -m pip_audit --no-deps --strict
          --vulnerability-service osv
          -r backend/requirements-ai.txt

  dependency-review:
    name: Dependency graph review (GitHub Advanced Security)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
