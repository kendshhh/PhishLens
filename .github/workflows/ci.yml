name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Lint backend
        run: python -m ruff check backend

      - name: Test API
        run: python -m pytest backend/tests -q -p no:cacheprovider

      - name: Check Python compilation
        run: python -m compileall -q backend/app