name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install extension checking dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          test -f extension/js/api.js
          test -f extension/js/history.js
          test -f extension/tests/api.test.mjs
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find extension -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Lint extension JavaScript
        run: npm run lint

      - name: Test history client with mocked responses
        run: npm test

      - name: Validate extension manifest and required files
        run: npm run validate

      - name: Package extension
        id: package_extension
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run package

      - name: Verify production package identity
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/verify_extension_package.py
          output/extension/PhishLens-Extension.zip
          output/extension/evidence.json
          --expected-source "$SOURCE_COMMIT"

      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Test packaged extension in isolated Chromium
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:browser

      - name: Require browser acceptance report and evidence
        run: |
          set -euo pipefail
          test -s output/extension/browser-acceptance.json
          test -d output/extension/browser-evidence
          find output/extension/browser-evidence -type f -print -quit | grep -q .

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Extension-Browser-Acceptance
          path: |
            output/extension/browser-acceptance.json
            output/extension/browser-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Upload extension package
        if: always() && steps.package_extension.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhishLens-Extension
          path: |
            output/extension/PhishLens-Extension.zip
            output/extension/evidence.json
          if-no-files-found: error
          retention-days: 7

  migration-source-preflight:
    name: Migration source preflight
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.migration-source.outputs.current }}
    steps:
      # The lookup uses a trusted default-branch script, never the PR checkout.
      - name: Check out trusted migration preflight controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      # Old workflow reruns keep the PR head captured when the run was queued.
      # Skip the historical staging check after the PR advances or closes.
      - name: Check whether migration source is still the current PR head
        id: migration-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIGRATION_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MIGRATION_PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          from scripts.secretary.github_api import APIError, GitHub

          number = int(os.environ['MIGRATION_PR'])
          expected = os.environ['MIGRATION_PR_HEAD_SHA']
          skip_reason = None
          try:
              current = GitHub().request(f'pulls/{number}')
              is_current = (current['state'] == 'open'
                            and current['head']['sha'] == expected
                            and not current.get('draft', False))
          except APIError as error:
              is_current = False
              skip_reason = f'GitHub could not confirm the current PR head ({error}); migration validation is blocked.'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'current={str(is_current).lower()}\n')
          if is_current:
              print(f'PR #{number} is still at the migration source head {expected}.')
          else:
              print(f'PR #{number} migration source is superseded; exact-source validation skipped.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  reason = skip_reason or f'PR #{number} is closed, a draft, or has a different head than `{expected}`.'
                  summary.write(f'Exact-source migration validation skipped: {reason} The current PR head owns migration validation.\n')
              if skip_reason:
                  raise SystemExit(1)
          PY

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      migration_revision: ${{ steps.hosted-migration-lineage.outputs.head || steps.migration-lineage.outputs.head }}
    needs: migration-source-preflight
    if: always() && !cancelled()
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: phishlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: phishlens_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U phishlens -d phishlens_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://phishlens:ci-only-password@localhost:5432/phishlens_dev
      RUN_DATABASE_TESTS: "1"
      AI_MODE: mock
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Fail if migration-source preflight failed
        if: always() && needs.migration-source-preflight.result == 'failure'
        run: |
          echo "Migration source could not be verified; backend checks cannot continue safely."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Hosted staging deploys the PR head, while this job's default checkout is
      # GitHub's synthetic merge ref. Validate the exact deploy target as well.
      - name: Check out exact hosted staging source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.migration-source-preflight.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: staging-target
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # The development lockfile includes all runtime pins plus test/lint tools.
      - name: Install backend test dependencies with uv
        run: uv pip install --system -r backend/requirements-dev.txt

      - name: Create disposable PostgreSQL test database
        run: |
          python - <<'PY'
          import os
          import psycopg

          url = os.environ["DATABASE_URL"].replace(
              "postgresql+psycopg://", "postgresql://", 1
          )
          with psycopg.connect(url, autocommit=True) as connection:
              connection.execute("CREATE DATABASE phishlens_s2_t1_test")
          PY

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Lint backend
        run: python -m ruff check backend
      - name: Lint trusted secretary code
        run: python -m ruff check scripts/secretary

      - name: Test trusted secretary controllers
        run: python -m pytest scripts/tests/test_secretary.py -q -p no:cacheprovider

      - name: Test release manifest, target safety, and artifact gates
        run: python -m pytest scripts/tests/test_release_readiness.py scripts/tests/test_release_extension_package.py scripts/tests/test_release_render.py -q -p no:cacheprovider

      - name: Build backend image without publishing
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          docker build --pull
          --tag "phishlens-api:ci-${{ github.run_id }}"
          --build-arg "PHISHLENS_SOURCE_SHA=$SOURCE_COMMIT"
          --file backend/Dockerfile .

      - name: Verify exact merge commit migration lineage
        id: migration-lineage
        run: python scripts/verify_migration_lineage.py --repo-root .

      - name: Verify disposable database configuration before migrations
        env:
          DATABASE_URL: postgresql+psycopg://phishlens:ci-only-password@localhost:5432/phishlens_s2_t1_test
        run: python scripts/ci_backend.py --check-environment

      - name: Verify exact hosted staging migration history
        id: hosted-migration-lineage
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.migration-source-preflight.outputs.current == 'true'
        run: python scripts/verify_migration_lineage.py --repo-root staging-target

      - name: Apply database migrations
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Verify repeated migration
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Seed synthetic database records
        run: python scripts/seed_demo.py

      - name: Verify repeated seed execution
        run: python scripts/seed_demo.py

      - name: Verify seeded database integrity
        env:
          RUN_SEED_INTEGRITY_TESTS: "1"
        run: python -m pytest backend/tests/test_seed_integrity.py -q -p no:cacheprovider

      - name: Apply database migrations to disposable test database
        env:
          DATABASE_URL: postgresql+psycopg://phishlens:ci-only-password@localhost:5432/phishlens_s2_t1_test
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini upgrade head

      - name: Test API
        env:
          DATABASE_URL: postgresql+psycopg://phishlens:ci-only-password@localhost:5432/phishlens_s2_t1_test
        run: python scripts/ci_backend.py

      - name: Preserve backend API and PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Backend-Test-Evidence
          path: output/backend-ci/
          if-no-files-found: warn
          retention-days: 7

      - name: Check Python compilation
        run: python -m compileall -q backend/app

  issue-90-readonly-hosted:
    name: Issue 90 read-only staging package
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/issue-90-readonly-artifact-v2-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: phishlens-hosted-staging
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Read current staging identity, readiness, and model
        id: read-staging
        env:
          STAGING_URL: https://phishlens-staging.onrender.com
          EXPECTED_MODEL_SHA: a2f13c256dd46c3267263f8de8f4f822206c5b0ceda96658713e2523a7f9559c
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = os.environ['STAGING_URL'].rstrip('/')
          def get(path):
              request = Request(base + path, headers={
                  'Accept': 'application/json',
                  'Cache-Control': 'no-cache',
              })
              with urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path} returned HTTP {response.status}')
                  return json.load(response)

          version = get('/version')
          ready = get('/ready')
          model = get('/model-info')
          observed_sha = version.get('commit')
          if not isinstance(observed_sha, str) or re.fullmatch(r'[0-9a-f]{40}', observed_sha) is None:
              raise RuntimeError(f'Staging returned an invalid commit identity: {version}')
          if version.get('environment') != 'staging':
              raise RuntimeError(f'Expected the staging environment: {version}')
          if ready.get('status') != 'ready' or ready.get('database') != 'connected':
              raise RuntimeError(f'Staging readiness check failed: {ready}')
          if (model.get('provider_mode') != 'tfidf'
                  or model.get('model_sha256') != os.environ['EXPECTED_MODEL_SHA']
                  or model.get('accepts_tfidf_reports') is not True
                  or model.get('accepts_local_reviews') is not True):
              raise RuntimeError(f'TF-IDF model identity check failed: {model}')

          evidence = {
              'recorded_at': dt.datetime.now(dt.timezone.utc).isoformat(),
              'backend_source_commit': observed_sha,
              'extension_source_commit': observed_sha,
              'environment': 'staging',
              'version': version,
              'ready': ready,
              'model_info': model,
              'saved_analysis_crud_performed': False,
              'production_writes_performed': False,
          }
          output_dir = Path('output/issue-90-readonly')
          output_dir.mkdir(parents=True, exist_ok=True)
          (output_dir / 'staging-readonly-evidence.json').write_text(
              json.dumps(evidence, indent=2) + '\n', encoding='utf-8'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as result:
              result.write(f'commit={observed_sha}\n')
          print(json.dumps(evidence, indent=2))
          PY
      - name: Check out the exact observed staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.read-staging.outputs.commit }}
          path: staging-source
          persist-credentials: false
      - name: Build and verify a staging-only extension package
        env:
          STAGING_BASE_URL: https://phishlens-staging.onrender.com
          STAGING_EXPECTED_SHA: ${{ steps.read-staging.outputs.commit }}
        run: |
          set -euo pipefail
          python scripts/package_staging_extension.py \
            --source-root staging-source \
            --expected-staging "$STAGING_EXPECTED_SHA" \
            --output output/issue-90-readonly/PhishLens-Staging-Extension.zip \
            --evidence output/issue-90-readonly/package-evidence.json
          python scripts/verify_staging_extension_package.py \
            output/issue-90-readonly/PhishLens-Staging-Extension.zip \
            output/issue-90-readonly/package-evidence.json \
            --expected-staging "$STAGING_EXPECTED_SHA" \
            --staging-evidence output/issue-90-readonly/staging-readonly-evidence.json
      - name: Recheck staging identity before upload
        env:
          STAGING_URL: https://phishlens-staging.onrender.com
          STAGING_EXPECTED_SHA: ${{ steps.read-staging.outputs.commit }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          request = Request(os.environ['STAGING_URL'].rstrip('/') + '/version', headers={
              'Accept': 'application/json',
              'Cache-Control': 'no-cache',
          })
          with urlopen(request, timeout=30) as response:
              observed = json.load(response)
          expected = os.environ['STAGING_EXPECTED_SHA']
          if (re.fullmatch(r'[0-9a-f]{40}', expected) is None
                  or observed.get('environment') != 'staging'
                  or observed.get('commit') != expected):
              raise RuntimeError(
                  f'Staging changed before upload: expected {expected}, observed {observed}'
              )
          print(f'Confirmed staging still serves {expected}; package upload may proceed.')
          PY
      - name: Upload staging-only Issue 90 package and read-only evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhishLens-Issue-90-Staging
          path: |
            output/issue-90-readonly/PhishLens-Staging-Extension.zip
            output/issue-90-readonly/package-evidence.json
            output/issue-90-readonly/staging-readonly-evidence.json
          if-no-files-found: error
          retention-days: 7

  staging:
    name: Staging integration
    needs: [extension, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: phishlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: phishlens_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U phishlens -d phishlens_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://phishlens:ci-only-password@localhost:5432/phishlens_dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test hosted history authentication smoke
        run: node --test scripts/tests/staging_history.test.mjs
      - name: Start staging and test extension API integration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/start_staging.py > /tmp/phishlens-staging.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          if ! node scripts/staging_smoke.mjs; then
            cat /tmp/phishlens-staging.log
            exit 1
          fi
      - name: Test staging deployment guards
        run: python -m unittest discover -s scripts/tests -v

  # Check PR heads before staging so obsolete runs never enter the queue
  # or deploy code that is no longer the PR head.
  hosted-staging-preflight:
    name: Hosted staging preflight
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'needs-hosted-staging') && vars.SECRETARY_PREVIEW_ENABLED == 'true' && !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [staging]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.staging-preflight.outputs.current }}
    steps:
      - name: Read trusted legacy controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Check PR head before entering staging queue
        id: staging-preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          from scripts.deploy_staging import live_pr_matches, requested_pr_identity
          from scripts.secretary.github_api import APIError, ReadOnlyGitHub

          number, expected = requested_pr_identity()
          skip_reason = None
          try:
              api = ReadOnlyGitHub(
                  repo=os.environ.get('GITHUB_REPOSITORY'),
                  token=os.environ.get('GITHUB_TOKEN', ''),
              )
              current = api.request(f'pulls/{number}')
              is_current = live_pr_matches(
                  current, number, expected, os.environ['GITHUB_REPOSITORY']
              )
          except APIError as error:
              is_current = False
              skip_reason = f'GitHub could not confirm the current PR head ({error}); no deployment was started.'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'current={str(is_current).lower()}\n')
          if is_current:
              print(f'PR #{number} is still at the queued head {expected}.')
          else:
              print(f'PR #{number} staging run is superseded; deployment skipped.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  reason = skip_reason or f'PR #{number} is closed, a draft, has a different head than `{expected}`, or no longer has the `needs-hosted-staging` label.'
                  summary.write(f'Staging skipped before deployment: {reason} The latest PR run owns staging.\n')
              if skip_reason:
                  raise SystemExit(1)
          PY

  # Preserve the stable Hosted staging status while protected, exact-candidate
  # browser acceptance replaces the old unauthenticated smoke. Render deployment
  # remains controlled by the trusted default-branch script.
  hosted-staging:
    name: Hosted staging
    if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'needs-hosted-staging') && vars.SECRETARY_PREVIEW_ENABLED == 'true' && vars.SECRETARY_REPLACES_LEGACY_STAGING != 'true' && !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'codex/issue-90-readonly-artifact-v2-20261106'
    needs: [staging, hosted-staging-preflight, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: phishlens-hosted-staging
      cancel-in-progress: false
      # Serialize hosted staging while preserving queued PR candidates.
      queue: max
    env:
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      STAGING_MIGRATION_REVISION: ${{ needs.backend.outputs.migration_revision }}
    steps:
      - name: Fail instead of skipping when an eligible staging prerequisite failed
        env:
          STAGING_INTEGRATION_RESULT: ${{ needs.staging.result }}
          PREFLIGHT_RESULT: ${{ needs.hosted-staging-preflight.result }}
          PREFLIGHT_CURRENT: ${{ needs.hosted-staging-preflight.outputs.current }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MIGRATION_REVISION: ${{ needs.backend.outputs.migration_revision }}
        run: |
          python - <<'PY'
          import os
          checks = {
              'Staging integration': os.environ.get('STAGING_INTEGRATION_RESULT'),
              'Hosted staging preflight': os.environ.get('PREFLIGHT_RESULT'),
              'current PR head': os.environ.get('PREFLIGHT_CURRENT'),
              'Backend checks': os.environ.get('BACKEND_RESULT'),
          }
          failures = [f'{name}={value}' for name, value in checks.items()
                      if value != ('true' if name == 'current PR head' else 'success')]
          if not os.environ.get('MIGRATION_REVISION', '').strip():
              failures.append('backend migration revision is missing')
          if failures:
              raise SystemExit('Hosted staging prerequisites failed: ' + ', '.join(failures))
          PY
      - name: Read trusted controller code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Recheck PR head immediately before deployment
        id: staging-final-preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          from scripts.deploy_staging import live_pr_matches, requested_pr_identity
          from scripts.secretary.github_api import APIError, ReadOnlyGitHub

          number, expected = requested_pr_identity()
          skip_reason = None
          try:
              api = ReadOnlyGitHub(
                  repo=os.environ.get('GITHUB_REPOSITORY'),
                  token=os.environ.get('GITHUB_TOKEN', ''),
              )
              current = api.request(f'pulls/{number}')
              is_current = live_pr_matches(
                  current, number, expected, os.environ['GITHUB_REPOSITORY']
              )
          except APIError as error:
              is_current = False
              skip_reason = f'GitHub could not confirm the current PR head ({error}); deployment remains blocked.'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'current={str(is_current).lower()}\n')
          if is_current:
              print(f'PR #{number} is still at the expected head {expected}.')
          else:
              print(f'PR #{number} staging run is superseded; deployment skipped.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  reason = skip_reason or f'PR #{number} is closed, a draft, has a different head than `{expected}`, or no longer has the `needs-hosted-staging` label.'
                  summary.write(f'Staging skipped before deployment: {reason} The latest PR run owns staging.\n')
              if skip_reason:
                  raise SystemExit(1)
          PY
      - name: Check out exact PR head
        if: steps.staging-final-preflight.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-source
          persist-credentials: false

      - name: Verify isolated Neon branch and Render database mapping before deployment
        id: neon-preflight
        if: steps.staging-final-preflight.outputs.current == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          STAGING_NEON_PROJECT_ID: ${{ vars.STAGING_NEON_PROJECT_ID }}
          PRODUCTION_NEON_PROJECT_ID: ${{ vars.PRODUCTION_NEON_PROJECT_ID }}
          STAGING_NEON_BRANCH_ID: ${{ vars.STAGING_NEON_BRANCH_ID }}
          PRODUCTION_NEON_BRANCH_ID: ${{ vars.PRODUCTION_NEON_BRANCH_ID }}
          STAGING_NEON_PARENT_ID: ${{ vars.STAGING_NEON_PARENT_ID }}
          STAGING_NEON_SCHEMA_ONLY_ATTESTATION: ${{ vars.STAGING_NEON_SCHEMA_ONLY_ATTESTATION }}
          STAGING_NEON_EXPECTED_HOST: ${{ vars.STAGING_NEON_EXPECTED_HOST }}
          PRODUCTION_NEON_EXPECTED_HOST: ${{ vars.PRODUCTION_NEON_EXPECTED_HOST }}
          SECRETARY_STAGING_DB_HOST: ${{ vars.SECRETARY_STAGING_DB_HOST }}
          SECRETARY_PRODUCTION_DB_HOST: ${{ vars.SECRETARY_PRODUCTION_DB_HOST }}
          STAGING_NEON_PRODUCTION_ROWS_PRESENT: ${{ vars.STAGING_NEON_PRODUCTION_ROWS_PRESENT }}
          STAGING_RENDER_DATABASE_CONFIG_ATTESTATION: ${{ vars.STAGING_RENDER_DATABASE_CONFIG_ATTESTATION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phishlens-hosted-staging"
          python - <<'PY'
          import json, os, re
          config = json.load(open('pr-source/.github/secretary.json', encoding='utf-8'))
          def normalized(host):
              return re.sub(r'-pooler(?=\.)', '', host.strip().rstrip('.').lower())
          required = (
              'NEON_API_KEY', 'STAGING_NEON_PROJECT_ID', 'PRODUCTION_NEON_PROJECT_ID',
              'STAGING_NEON_BRANCH_ID',
              'PRODUCTION_NEON_BRANCH_ID', 'STAGING_NEON_EXPECTED_HOST',
              'PRODUCTION_NEON_EXPECTED_HOST', 'SECRETARY_STAGING_DB_HOST',
              'SECRETARY_PRODUCTION_DB_HOST',
          )
          if any(not os.environ.get(key, '').strip() for key in required):
              raise SystemExit('Hosted staging is blocked: isolated Neon/Render identity is not fully configured.')
          if os.environ.get('STAGING_NEON_PARENT_ID', ''):
              raise SystemExit('Hosted staging requires an independent Neon root branch.')
          if os.environ.get('STAGING_NEON_SCHEMA_ONLY_ATTESTATION') != 'true':
              raise SystemExit('Hosted staging requires a schema-only Neon branch attestation.')
          if os.environ.get('STAGING_NEON_PRODUCTION_ROWS_PRESENT') != 'false':
              raise SystemExit('Hosted staging must attest that production rows are absent.')
          if os.environ.get('STAGING_RENDER_DATABASE_CONFIG_ATTESTATION') != 'current':
              raise SystemExit('Hosted staging Render-to-Neon mapping has not been privately verified.')
          if (os.environ['STAGING_NEON_PROJECT_ID'] != config['staging_neon_project_id']
                  or os.environ['STAGING_NEON_BRANCH_ID'] != config['staging_neon_branch_id']
                  or normalized(os.environ['STAGING_NEON_EXPECTED_HOST']) != normalized(config['staging_database_host'])):
              raise SystemExit('Hosted staging protected variables differ from the owner-approved Neon target.')
          staging = normalized(os.environ['STAGING_NEON_EXPECTED_HOST'])
          render_staging = normalized(os.environ['SECRETARY_STAGING_DB_HOST'])
          production = normalized(os.environ['PRODUCTION_NEON_EXPECTED_HOST'])
          render_production = normalized(os.environ['SECRETARY_PRODUCTION_DB_HOST'])
          if os.environ['STAGING_NEON_PROJECT_ID'] == os.environ['PRODUCTION_NEON_PROJECT_ID']:
              raise SystemExit('Hosted staging must use a Neon project separate from production.')
          if not staging.startswith('ep-') or not staging.endswith('.aws.neon.tech') or staging != render_staging:
              raise SystemExit('Hosted staging Render database host does not match the Neon branch endpoint.')
          if not production.startswith('ep-') or not production.endswith('.aws.neon.tech') or production != render_production or staging == production:
              raise SystemExit('Hosted staging and production Neon endpoints are not distinct and verified.')
          PY
          python pr-source/scripts/verify_neon_release_branch.py \
            --expected-host "$STAGING_NEON_EXPECTED_HOST" \
            > "$RUNNER_TEMP/phishlens-hosted-staging/neon-branch.json"
          branch_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["branch_id"])' "$RUNNER_TEMP/phishlens-hosted-staging/neon-branch.json")"
          endpoint_host="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["endpoint_host"])' "$RUNNER_TEMP/phishlens-hosted-staging/neon-branch.json")"
          {
            echo "branch_id=$branch_id"
            echo "endpoint_host=$endpoint_host"
          } >> "$GITHUB_OUTPUT"

      - name: Build and verify the exact-head staging extension package
        if: steps.staging-final-preflight.outputs.current == 'true'
        env:
          STAGING_COMMIT: ${{ github.event.pull_request.head.sha }}
          PRODUCTION_AUTH_URL: ${{ vars.PHISHLENS_PRODUCTION_AUTH_URL }}
          PRODUCTION_AUTH_DATABASE: ${{ vars.PHISHLENS_PRODUCTION_AUTH_DATABASE }}
          STAGING_AUTH_URL: ${{ vars.PHISHLENS_STAGING_AUTH_URL }}
          STAGING_AUTH_DATABASE: ${{ vars.PHISHLENS_STAGING_AUTH_DATABASE }}
        run: |
          set -euo pipefail
          python scripts/package_release_extension.py \
            --expected-sha "$STAGING_COMMIT" \
            --production-auth-url "$PRODUCTION_AUTH_URL" \
            --production-auth-database "$PRODUCTION_AUTH_DATABASE" \
            --staging-auth-url "$STAGING_AUTH_URL" \
            --staging-auth-database "$STAGING_AUTH_DATABASE" \
            --output "$RUNNER_TEMP/phishlens-hosted-staging/PhishLens-Staging-Extension.zip" \
            --evidence "$RUNNER_TEMP/phishlens-hosted-staging/extension-evidence.json"
          python -m scripts.release_readiness verify-release-extension \
            --archive "$RUNNER_TEMP/phishlens-hosted-staging/PhishLens-Staging-Extension.zip" \
            --evidence "$RUNNER_TEMP/phishlens-hosted-staging/extension-evidence.json" \
            --expected-sha "$STAGING_COMMIT"
        working-directory: pr-source

      - name: Install exact-head browser acceptance dependencies
        if: steps.staging-final-preflight.outputs.current == 'true'
        working-directory: pr-source
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Recheck PR head immediately before staging deploy
        id: staging-deploy-preflight
        if: steps.staging-final-preflight.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          from scripts.deploy_staging import live_pr_matches, requested_pr_identity
          from scripts.secretary.github_api import APIError, ReadOnlyGitHub

          number, expected = requested_pr_identity()
          api = ReadOnlyGitHub(
              repo=os.environ.get('GITHUB_REPOSITORY'),
              token=os.environ.get('GITHUB_TOKEN', ''),
          )
          try:
              current = api.request(f'pulls/{number}')
          except APIError as error:
              raise SystemExit(f'GitHub could not confirm the current PR head; staging deployment blocked ({error}).') from None
          is_current = live_pr_matches(
              current, number, expected, os.environ['GITHUB_REPOSITORY']
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'current={str(is_current).lower()}\n')
          if is_current:
              print(f'PR #{number} remains at the requested staging head {expected}.')
          else:
              print(f'PR #{number} changed while staging was prepared; deployment skipped.')
          PY

      - name: Verify Render staging Auth mode and exact database mapping
        if: steps.staging-deploy-preflight.outputs.current == 'true'
        env:
          RENDER_STAGING_API_KEY: ${{ secrets.RENDER_STAGING_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
          SECRETARY_STAGING_DB_HOST: ${{ vars.SECRETARY_STAGING_DB_HOST }}
          SECRETARY_PRODUCTION_DB_HOST: ${{ vars.SECRETARY_PRODUCTION_DB_HOST }}
          STAGING_AUTH_URL: ${{ vars.PHISHLENS_STAGING_AUTH_URL }}
          STAGING_AUTH_DATABASE: ${{ vars.PHISHLENS_STAGING_AUTH_DATABASE }}
          STAGING_AUTH_USER_A_EMAIL: ${{ secrets.STAGING_AUTH_USER_A_EMAIL }}
          STAGING_AUTH_USER_A_PASSWORD: ${{ secrets.STAGING_AUTH_USER_A_PASSWORD }}
          STAGING_AUTH_USER_B_EMAIL: ${{ secrets.STAGING_AUTH_USER_B_EMAIL }}
          STAGING_AUTH_USER_B_PASSWORD: ${{ secrets.STAGING_AUTH_USER_B_PASSWORD }}
          STAGING_NEON_BRANCH_ID: ${{ steps.neon-preflight.outputs.branch_id }}
          STAGING_NEON_PROJECT_ID: ${{ vars.STAGING_NEON_PROJECT_ID }}
          STAGING_NEON_EXPECTED_HOST: ${{ vars.STAGING_NEON_EXPECTED_HOST }}
          PRODUCTION_NEON_BRANCH_ID: ${{ vars.PRODUCTION_NEON_BRANCH_ID }}
          PRODUCTION_NEON_PROJECT_ID: ${{ vars.PRODUCTION_NEON_PROJECT_ID }}
          PRODUCTION_NEON_EXPECTED_HOST: ${{ vars.PRODUCTION_NEON_EXPECTED_HOST }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.error, urllib.request
          from urllib.parse import urlsplit
          from scripts.secretary.preview import render_request, verify_environment, verify_service
          trusted_config = json.loads(open('.github/secretary.json', encoding='utf-8').read())
          target_config = json.loads(open('pr-source/.github/secretary.json', encoding='utf-8').read())
          service_id = os.environ['RENDER_STAGING_SERVICE_ID']
          if service_id != trusted_config['staging_service'] or service_id == trusted_config['production_service']:
              raise SystemExit('Hosted staging is not the allowlisted Render staging service.')
          service = render_request(f'services/{service_id}')
          verify_service(service, trusted_config)
          rows = render_request(f'services/{service_id}/env-vars?limit=100')
          report_auth_mode = verify_environment(rows, require_authenticated=True)
          values = {row['envVar']['key']: row['envVar']['value'] for row in rows}
          def normalized(host):
              return re.sub(r'-pooler(?=\.)', '', host.strip().rstrip('.').lower())
          if (os.environ['STAGING_NEON_PROJECT_ID'] != target_config['staging_neon_project_id']
                  or os.environ['STAGING_NEON_BRANCH_ID'] != target_config['staging_neon_branch_id']):
              raise SystemExit('Hosted staging branch variables differ from the owner-approved target.')
          expected_host = target_config['staging_database_host']
          if (normalized(os.environ['STAGING_NEON_EXPECTED_HOST']) != normalized(expected_host)
                  or normalized(values.get('STAGING_NEON_EXPECTED_HOST', '')) != normalized(expected_host)
                  or normalized(values.get('STAGING_DATABASE_HOST', '')) != normalized(expected_host)):
              raise SystemExit('Render staging database host differs from the owner-approved Neon target.')
          for name in ('DATABASE_URL', 'STAGING_MIGRATION_DATABASE_URL'):
              if normalized(urlsplit(values.get(name, '')).hostname or '') != normalized(expected_host):
                  raise SystemExit(f'Render {name} does not target the owner-approved Neon branch.')
          if (values.get('STAGING_NEON_PROJECT_ID') != target_config['staging_neon_project_id']
                  or values.get('STAGING_NEON_BRANCH_ID') != target_config['staging_neon_branch_id']):
              raise SystemExit('Render project/branch variables do not match the owner-approved Neon target.')
          auth_url = os.environ['STAGING_AUTH_URL'].strip().rstrip('/')
          auth_parts = urlsplit(auth_url)
          if (auth_parts.scheme != 'https' or auth_parts.hostname != target_config['staging_auth_host']
                  or auth_parts.path != '/phishlens_dev/auth' or auth_parts.username or auth_parts.password
                  or auth_parts.port is not None or auth_parts.query or auth_parts.fragment
                  or os.environ['STAGING_AUTH_DATABASE'] != 'phishlens_dev'
                  or values.get('NEON_AUTH_BASE_URL', '').strip().rstrip('/') != auth_url):
              raise SystemExit('GitHub and Render Neon Auth targets do not match the owner-approved branch.')
          if os.environ.get('STAGING_BASE_URL', '').rstrip('/') != target_config['staging_origin']:
              raise SystemExit('Staging API origin does not match the owner-approved Auth origin.')
          email_a = os.environ.get('STAGING_AUTH_USER_A_EMAIL', '').strip().lower()
          email_b = os.environ.get('STAGING_AUTH_USER_B_EMAIL', '').strip().lower()
          password_a = os.environ.get('STAGING_AUTH_USER_A_PASSWORD', '')
          password_b = os.environ.get('STAGING_AUTH_USER_B_PASSWORD', '')
          if not email_a or not email_b or email_a == email_b or not password_a or not password_b:
              raise SystemExit('Hosted staging requires two distinct, pre-registered synthetic Auth accounts.')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          request = urllib.request.Request(
              auth_url + '/sign-in/email', method='OPTIONS',
              headers={'Origin': target_config['staging_origin'],
                       'Access-Control-Request-Method': 'POST',
                       'Access-Control-Request-Headers': 'content-type'},
          )
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=10) as response:
                  status, headers = response.status, response.headers
          except urllib.error.HTTPError as error:
              status, headers = error.code, error.headers
          except (urllib.error.URLError, TimeoutError, OSError):
              raise SystemExit('Neon Auth endpoint preflight failed (DNS/TLS/network/timeout).') from None
          allowed_methods = {part.strip().upper() for part in headers.get('Access-Control-Allow-Methods', '').split(',')}
          allowed_headers = {part.strip().lower() for part in headers.get('Access-Control-Allow-Headers', '').split(',')}
          if (status not in (200, 204)
                  or headers.get('Access-Control-Allow-Origin') != target_config['staging_origin']
                  or 'POST' not in allowed_methods or 'content-type' not in allowed_headers
                  or headers.get('Access-Control-Allow-Credentials', '').lower() != 'true'):
              raise SystemExit('Neon Auth CORS preflight did not allow the owner-approved staging origin.')
          expected = {
              'STAGING_NEON_BRANCH_ID': os.environ['STAGING_NEON_BRANCH_ID'],
              'STAGING_NEON_PROJECT_ID': os.environ['STAGING_NEON_PROJECT_ID'],
              'PRODUCTION_NEON_BRANCH_ID': os.environ['PRODUCTION_NEON_BRANCH_ID'],
              'PRODUCTION_NEON_PROJECT_ID': os.environ['PRODUCTION_NEON_PROJECT_ID'],
          }
          for key, value in expected.items():
              if values.get(key) != value:
                  raise SystemExit(f'Render staging {key} does not match the verified Neon branch.')
          for key in ('STAGING_NEON_EXPECTED_HOST', 'STAGING_DATABASE_HOST', 'PRODUCTION_NEON_EXPECTED_HOST'):
              if not values.get(key):
                  raise SystemExit(f'Render staging is missing required branch mapping setting {key}.')
          if normalized(values['STAGING_NEON_EXPECTED_HOST']) != normalized(os.environ['STAGING_NEON_EXPECTED_HOST']):
              raise SystemExit('Render staging Neon host does not match the verified branch endpoint.')
          if normalized(values['STAGING_DATABASE_HOST']) != normalized(os.environ['STAGING_NEON_EXPECTED_HOST']):
              raise SystemExit('Render staging runtime host does not match the verified Neon branch endpoint.')
          if normalized(values['PRODUCTION_NEON_EXPECTED_HOST']) != normalized(os.environ['PRODUCTION_NEON_EXPECTED_HOST']):
              raise SystemExit('Render staging production-host guard does not match the production allowlist.')
          if report_auth_mode != 'neon':
              raise SystemExit('Hosted staging requires Neon Auth before any deployment.')
          print('Render staging is privately mapped to the verified isolated branch and Neon Auth.')
          PY

      - name: Deploy exact PR head using the trusted controller
        if: steps.staging-deploy-preflight.outputs.current == 'true'
        env:
          RENDER_STAGING_API_KEY: ${{ secrets.RENDER_STAGING_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
          SECRETARY_STAGING_DB_HOST: ${{ vars.SECRETARY_STAGING_DB_HOST }}
          SECRETARY_PRODUCTION_DB_HOST: ${{ vars.SECRETARY_PRODUCTION_DB_HOST }}
          STAGING_AUTH_URL: ${{ vars.PHISHLENS_STAGING_AUTH_URL }}
          STAGING_AUTH_DATABASE: ${{ vars.PHISHLENS_STAGING_AUTH_DATABASE }}
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_COMMIT: ${{ github.event.pull_request.head.sha }}
          STAGING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_PR: ${{ github.event.pull_request.number }}
        run: python scripts/deploy_staging.py

      - name: Run authenticated extension and persistent CRUD acceptance
        id: staging-product-acceptance
        if: steps.staging-deploy-preflight.outputs.current == 'true'
        continue-on-error: true
        working-directory: pr-source
        env:
          STAGING_ACCEPTANCE_ENABLED: ${{ vars.STAGING_ACCEPTANCE_ENABLED }}
          STAGING_ACCEPTANCE_MODE: pr-source
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_EXPECTED_BACKEND_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_EXTENSION_ZIP: ${{ runner.temp }}/phishlens-hosted-staging/PhishLens-Staging-Extension.zip
          RELEASE_EXTENSION_EVIDENCE: ${{ runner.temp }}/phishlens-hosted-staging/extension-evidence.json
          STAGING_AUTH_URL: ${{ vars.PHISHLENS_STAGING_AUTH_URL }}
          STAGING_AUTH_DATABASE: ${{ vars.PHISHLENS_STAGING_AUTH_DATABASE }}
          STAGING_AUTH_TRUSTED_CHROME_ORIGIN: ${{ vars.STAGING_AUTH_TRUSTED_CHROME_ORIGIN }}
          STAGING_NEON_PROJECT_ID: ${{ vars.STAGING_NEON_PROJECT_ID }}
          STAGING_NEON_BRANCH_ID: ${{ steps.neon-preflight.outputs.branch_id }}
          STAGING_NEON_BRANCH_KIND: schema-only
          STAGING_NEON_PARENT_ID: ${{ vars.STAGING_NEON_PARENT_ID }}
          STAGING_NEON_PRODUCTION_ROWS_PRESENT: ${{ vars.STAGING_NEON_PRODUCTION_ROWS_PRESENT }}
          STAGING_MIGRATION_REVISION: ${{ needs.backend.outputs.migration_revision }}
          PRODUCTION_NEON_BRANCH_ID: ${{ vars.PRODUCTION_NEON_BRANCH_ID }}
          PRODUCTION_NEON_PROJECT_ID: ${{ vars.PRODUCTION_NEON_PROJECT_ID }}
          STAGING_AUTH_USER_A_EMAIL: ${{ secrets.STAGING_AUTH_USER_A_EMAIL }}
          STAGING_AUTH_USER_A_PASSWORD: ${{ secrets.STAGING_AUTH_USER_A_PASSWORD }}
          STAGING_AUTH_USER_B_EMAIL: ${{ secrets.STAGING_AUTH_USER_B_EMAIL }}
          STAGING_AUTH_USER_B_PASSWORD: ${{ secrets.STAGING_AUTH_USER_B_PASSWORD }}
          STAGING_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/phishlens-hosted-staging/staging-evidence.json
        run: node scripts/staging_extension_acceptance.mjs

      - name: Recheck PR head before publishing staging evidence
        id: staging-acceptance-finalize
        if: always() && steps.staging-deploy-preflight.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          from scripts.deploy_staging import live_pr_matches, requested_pr_identity
          from scripts.secretary.github_api import APIError, ReadOnlyGitHub

          number, expected = requested_pr_identity()
          try:
              api = ReadOnlyGitHub(
                  repo=os.environ.get('GITHUB_REPOSITORY'),
                  token=os.environ.get('GITHUB_TOKEN', ''),
              )
              current = api.request(f'pulls/{number}')
          except APIError as error:
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write('current=false\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f'Staging evidence publication blocked: GitHub could not confirm the PR head ({error}).\n')
              raise SystemExit('Staging evidence publication blocked because the live PR head could not be verified.') from None

          is_current = live_pr_matches(
              current, number, expected, os.environ['GITHUB_REPOSITORY']
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'current={str(is_current).lower()}\n')
          if is_current:
              print(f'PR #{number} is still at the expected head {expected}; staging evidence may be verified.')
          else:
              print(f'PR #{number} changed during hosted staging; stale evidence will not be published.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f'Staging evidence for PR #{number} was withheld because the PR closed, became a draft, lost its staging label, or advanced from `{expected}`.\n')
          PY

      - name: Require authenticated CRUD/UX product evidence; keep model quality separate
        if: always() && steps.staging-deploy-preflight.outputs.current == 'true' && steps.staging-acceptance-finalize.outputs.current == 'true'
        working-directory: pr-source
        env:
          STAGING_EVIDENCE: ${{ runner.temp }}/phishlens-hosted-staging/staging-evidence.json
          EXTENSION_ZIP: ${{ runner.temp }}/phishlens-hosted-staging/PhishLens-Staging-Extension.zip
          EXTENSION_EVIDENCE: ${{ runner.temp }}/phishlens-hosted-staging/extension-evidence.json
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_BRANCH_ID: ${{ steps.neon-preflight.outputs.branch_id }}
        run: |
          set -euo pipefail
          python -m scripts.release_readiness verify-pr-staging \
            --evidence "$STAGING_EVIDENCE" \
            --extension-zip "$EXTENSION_ZIP" \
            --extension-evidence "$EXTENSION_EVIDENCE" \
            --expected-sha "$EXPECTED_SHA" \
            --branch-id "$STAGING_BRANCH_ID" \
            | tee "$RUNNER_TEMP/phishlens-hosted-staging/acceptance-verification.json"
          echo 'Authenticated staging product acceptance passed for the exact candidate. Model-quality approval is separate; the release remains NO-GO until the AI owner approves the holdout policy and evidence.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve hosted staging acceptance evidence and extension
        if: always() && steps.staging-acceptance-finalize.outputs.current != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhishLens-Staging-Extension
          path: ${{ runner.temp }}/phishlens-hosted-staging/
          if-no-files-found: warn
          retention-days: 7

