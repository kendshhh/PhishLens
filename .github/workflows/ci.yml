          required = (
              'STAGING_NEON_PROJECT_ID', 'PRODUCTION_NEON_PROJECT_ID',
              'STAGING_NEON_BRANCH_ID',
              'PRODUCTION_NEON_BRANCH_ID', 'STAGING_NEON_EXPECTED_HOST',
              'PRODUCTION_NEON_EXPECTED_HOST', 'SECRETARY_STAGING_DB_HOST',
              'SECRETARY_PRODUCTION_DB_HOST',
