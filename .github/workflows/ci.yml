name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install extension checking dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          test -f extension/js/api.js
          test -f extension/js/history.js
          test -f extension/tests/api.test.mjs
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find extension -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Lint extension JavaScript
        run: npm run lint

      - name: Test history client with mocked responses
        run: npm test

      - name: Validate extension manifest and required files
        run: npm run validate

      - name: Package extension
        id: package_extension
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run package

      - name: Verify production package identity
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/verify_extension_package.py
          output/extension/PhishLens-Extension.zip
          output/extension/evidence.json
          --expected-source "$SOURCE_COMMIT"

      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Test packaged extension in isolated Chromium
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:browser

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Extension-Browser-Acceptance
          path: output/extension/browser-acceptance.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload extension package
        if: always() && steps.package_extension.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhishLens-Extension
          path: |
            output/extension/PhishLens-Extension.zip
            output/extension/evidence.json
          if-no-files-found: error
          retention-days: 7

  migration-source-preflight:
    name: Migration source preflight
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.migration-source.outputs.current }}
    steps:
      # The lookup uses a trusted default-branch script, never the PR checkout.
      - name: Check out trusted migration preflight controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      # Old workflow reruns keep the PR head captured when the run was queued.
      # Skip the historical staging check after the PR advances or closes.
      - name: Check whether migration source is still the current PR head
        id: migration-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIGRATION_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MIGRATION_PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          from scripts.secretary.github_api import APIError, GitHub

          number = int(os.environ['MIGRATION_PR'])
          expected = os.environ['MIGRATION_PR_HEAD_SHA']
          skip_reason = None
          try:
              current = GitHub().request(f'pulls/{number}')
              is_current = (current['state'] == 'open'
                            and current['head']['sha'] == expected
                            and not current.get('draft', False))
          except APIError as error:
              is_current = False
              skip_reason = f'GitHub could not confirm the current PR head ({error}); migration validation is blocked.'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'current={str(is_current).lower()}\n')
          if is_current:
              print(f'PR #{number} is still at the migration source head {expected}.')
          else:
              print(f'PR #{number} migration source is superseded; exact-source validation skipped.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  reason = skip_reason or f'PR #{number} is closed, a draft, or has a different head than `{expected}`.'
                  summary.write(f'Exact-source migration validation skipped: {reason} The current PR head owns migration validation.\n')
              if skip_reason:
                  raise SystemExit(1)
          PY

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      migration_revision: ${{ steps.migration-lineage.outputs.head }}
    needs: migration-source-preflight
    if: always() && !cancelled()
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: phishlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: phishlens_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U phishlens -d phishlens_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://phishlens:ci-only-password@localhost:5432/phishlens_dev
      RUN_DATABASE_TESTS: "1"
      AI_MODE: mock
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Fail if migration-source preflight failed
        if: always() && needs.migration-source-preflight.result == 'failure'
        run: |
          echo "Migration source could not be verified; backend checks cannot continue safely."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Hosted staging deploys the PR head, while this job's default checkout is
      # GitHub's synthetic merge ref. Validate the exact deploy target as well.
      - name: Check out exact hosted staging source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.migration-source-preflight.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: staging-target
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # The development lockfile includes all runtime pins plus test/lint tools.
      - name: Install backend test dependencies with uv
        run: uv pip install --system -r backend/requirements-dev.txt

      - name: Create disposable PostgreSQL test database
        run: |
          python - <<'PY'
          import os
          import psycopg

          url = os.environ["DATABASE_URL"].replace(
              "postgresql+psycopg://", "postgresql://", 1
          )
          with psycopg.connect(url, autocommit=True) as connection:
              connection.execute("CREATE DATABASE phishlens_s2_t1_test")
          PY

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Lint backend
        run: python -m ruff check backend
      - name: Lint trusted secretary code
        run: python -m ruff check scripts/secretary

      - name: Verify exact merge commit migration lineage
        id: migration-lineage
        run: python scripts/verify_migration_lineage.py --repo-root .

      - name: Verify disposable database configuration before migrations
        env:
          DATABASE_URL: postgresql+psycopg://phishlens:ci-only-password@localhost:5432/phishlens_s2_t1_test
        run: python scripts/ci_backend.py --check-environment

      - name: Verify exact hosted staging migration history
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.migration-source-preflight.outputs.current == 'true'
        run: python scripts/verify_migration_lineage.py --repo-root staging-target

      - name: Apply database migrations
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Verify repeated migration
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Seed synthetic database records
        run: python scripts/seed_demo.py

      - name: Verify repeated seed execution
        run: python scripts/seed_demo.py

      - name: Verify seeded database integrity
        env:
          RUN_SEED_INTEGRITY_TESTS: "1"
        run: python -m pytest backend/tests/test_seed_integrity.py -q -p no:cacheprovider

      - name: Apply database migrations to disposable test database
        env:
          DATABASE_URL: postgresql+psycopg://phishlens:ci-only-password@localhost:5432/phishlens_s2_t1_test
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini upgrade head

      - name: Test API
        env:
          DATABASE_URL: postgresql+psycopg://phishlens:ci-only-password@localhost:5432/phishlens_s2_t1_test
        run: python scripts/ci_backend.py

      - name: Preserve backend API and PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Backend-Test-Evidence
          path: output/backend-ci/
          if-no-files-found: warn
          retention-days: 7

      - name: Check Python compilation
        run: python -m compileall -q backend/app

  issue-90-readonly-hosted:
    name: Issue 90 read-only staging package
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/issue-90-readonly-artifact-v2-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: phishlens-hosted-staging
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Read current staging identity, readiness, and model
        id: read-staging
        env:
          STAGING_URL: https://phishlens-staging.onrender.com
          EXPECTED_MODEL_SHA: a2f13c256dd46c3267263f8de8f4f822206c5b0ceda96658713e2523a7f9559c
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = os.environ['STAGING_URL'].rstrip('/')
          def get(path):
              request = Request(base + path, headers={
                  'Accept': 'application/json',
                  'Cache-Control': 'no-cache',
              })
              with urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path} returned HTTP {response.status}')
                  return json.load(response)

          version = get('/version')
          ready = get('/ready')
          model = get('/model-info')
          observed_sha = version.get('commit')
          if not isinstance(observed_sha, str) or re.fullmatch(r'[0-9a-f]{40}', observed_sha) is None:
              raise RuntimeError(f'Staging returned an invalid commit identity: {version}')
          if version.get('environment') != 'staging':
              raise RuntimeError(f'Expected the staging environment: {version}')
          if ready.get('status') != 'ready' or ready.get('database') != 'connected':
              raise RuntimeError(f'Staging readiness check failed: {ready}')
          if (model.get('provider_mode') != 'tfidf'
                  or model.get('model_sha256') != os.environ['EXPECTED_MODEL_SHA']
                  or model.get('accepts_tfidf_reports') is not True
                  or model.get('accepts_local_reviews') is not True):
              raise RuntimeError(f'TF-IDF model identity check failed: {model}')

          evidence = {
              'recorded_at': dt.datetime.now(dt.timezone.utc).isoformat(),
              'backend_source_commit': observed_sha,
              'extension_source_commit': observed_sha,
              'environment': 'staging',
              'version': version,
              'ready': ready,
              'model_info': model,
              'saved_analysis_crud_performed': False,
              'production_writes_performed': False,
          }
          output_dir = Path('output/issue-90-readonly')
          output_dir.mkdir(parents=True, exist_ok=True)
          (output_dir / 'staging-readonly-evidence.json').write_text(
              json.dumps(evidence, indent=2) + '\n', encoding='utf-8'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as result:
              result.write(f'commit={observed_sha}\n')
          print(json.dumps(evidence, indent=2))
          PY
      - name: Check out the exact observed staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.read-staging.outputs.commit }}
          path: staging-source
          persist-credentials: false
      - name: Build and verify a staging-only extension package
        env:
          STAGING_BASE_URL: https://phishlens-staging.onrender.com
          STAGING_EXPECTED_SHA: ${{ steps.read-staging.outputs.commit }}
        run: |
          set -euo pipefail
          python scripts/package_staging_extension.py \
            --source-root staging-source \
            --expected-staging "$STAGING_EXPECTED_SHA" \
            --output output/issue-90-readonly/PhishLens-Staging-Extension.zip \
            --evidence output/issue-90-readonly/package-evidence.json
          python scripts/verify_staging_extension_package.py \
            output/issue-90-readonly/PhishLens-Staging-Extension.zip \
            output/issue-90-readonly/package-evidence.json \
            --expected-staging "$STAGING_EXPECTED_SHA" \
            --staging-evidence output/issue-90-readonly/staging-readonly-evidence.json
      - name: Recheck staging identity before upload
        env:
          STAGING_URL: https://phishlens-staging.onrender.com
          STAGING_EXPECTED_SHA: ${{ steps.read-staging.outputs.commit }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          request = Request(os.environ['STAGING_URL'].rstrip('/') + '/version', headers={
              'Accept': 'application/json',
              'Cache-Control': 'no-cache',
          })
          with urlopen(request, timeout=30) as response:
              observed = json.load(response)
          expected = os.environ['STAGING_EXPECTED_SHA']
          if (re.fullmatch(r'[0-9a-f]{40}', expected) is None
                  or observed.get('environment') != 'staging'
                  or observed.get('commit') != expected):
              raise RuntimeError(
                  f'Staging changed before upload: expected {expected}, observed {observed}'
              )
          print(f'Confirmed staging still serves {expected}; package upload may proceed.')
          PY
      - name: Upload staging-only Issue 90 package and read-only evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhishLens-Issue-90-Staging
          path: |
            output/issue-90-readonly/PhishLens-Staging-Extension.zip
            output/issue-90-readonly/package-evidence.json
            output/issue-90-readonly/staging-readonly-evidence.json
          if-no-files-found: error
          retention-days: 7

  staging:
    name: Staging integration
    needs: [extension, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: phishlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: phishlens_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U phishlens -d phishlens_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://phishlens:ci-only-password@localhost:5432/phishlens_dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Start staging and test extension API integration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/start_staging.py > /tmp/phishlens-staging.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          if ! node scripts/staging_smoke.mjs; then
            cat /tmp/phishlens-staging.log
            exit 1
          fi
      - name: Test staging deployment guards
        run: python -m unittest discover -s scripts/tests -v

  # Check PR heads before staging so obsolete runs never enter the queue
  # or deploy code that is no longer the PR head.
  hosted-staging-preflight:
    name: Hosted staging preflight
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'needs-hosted-staging') && vars.SECRETARY_PREVIEW_ENABLED == 'true' && vars.SECRETARY_REPLACES_LEGACY_STAGING != 'true' && !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [staging]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.staging-preflight.outputs.current }}
    steps:
      - name: Read trusted legacy controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Check PR head before entering staging queue
        id: staging-preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          from scripts.secretary.github_api import APIError, GitHub

          number = int(os.environ['STAGING_PR'])
          expected = os.environ['STAGING_PR_HEAD_SHA']
          skip_reason = None
          try:
              current = GitHub().request(f'pulls/{number}')
              labels = {label.get('name') for label in current.get('labels', [])
                        if isinstance(label, dict)}
              is_current = (current['state'] == 'open'
                            and current['head']['sha'] == expected
                            and not current.get('draft', False)
                            and 'needs-hosted-staging' in labels)
          except APIError as error:
              is_current = False
              skip_reason = f'GitHub could not confirm the current PR head ({error}); no deployment was started.'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'current={str(is_current).lower()}\n')
          if is_current:
              print(f'PR #{number} is still at the queued head {expected}.')
          else:
              print(f'PR #{number} staging run is superseded; deployment skipped.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  reason = skip_reason or f'PR #{number} is closed, a draft, has a different head than `{expected}`, or no longer has the `needs-hosted-staging` label.'
                  summary.write(f'Staging skipped before deployment: {reason} The latest PR run owns staging.\n')
              if skip_reason:
                  raise SystemExit(1)
          PY

  # Bootstrap bridge: preserve the current required check until the new controller
  # is proven on main. It runs ONLY trusted default-branch scripts. Retire this
  # after requiring Secretary staging; never bypass protection to install a bot.
  hosted-staging:
    name: Hosted staging
    if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'needs-hosted-staging') && vars.SECRETARY_PREVIEW_ENABLED == 'true' && vars.SECRETARY_REPLACES_LEGACY_STAGING != 'true' && !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'codex/issue-90-readonly-artifact-v2-20261106' && needs.staging.result == 'success' && needs.hosted-staging-preflight.result == 'success' && needs.hosted-staging-preflight.outputs.current == 'true' && needs.backend.result == 'success' && needs.backend.outputs.migration_revision != ''
    needs: [staging, hosted-staging-preflight, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: phishlens-hosted-staging
      cancel-in-progress: false
      # Serialize hosted staging while preserving queued PR candidates.
      queue: max
    env:
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      STAGING_MIGRATION_REVISION: ${{ needs.backend.outputs.migration_revision }}
    steps:
      - name: Read trusted legacy controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Recheck PR head immediately before deployment
        id: staging-final-preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          from scripts.secretary.github_api import APIError, GitHub

          number = int(os.environ['STAGING_PR'])
          expected = os.environ['STAGING_PR_HEAD_SHA']
          skip_reason = None
          try:
              current = GitHub().request(f'pulls/{number}')
              labels = {label.get('name') for label in current.get('labels', [])
                        if isinstance(label, dict)}
              is_current = (current['state'] == 'open'
                            and current['head']['sha'] == expected
                            and not current.get('draft', False)
                            and 'needs-hosted-staging' in labels)
          except APIError as error:
              is_current = False
              skip_reason = f'GitHub could not confirm the current PR head ({error}); deployment remains blocked.'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'current={str(is_current).lower()}\n')
          if is_current:
              print(f'PR #{number} is still at the expected head {expected}.')
          else:
              print(f'PR #{number} staging run is superseded; deployment skipped.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  reason = skip_reason or f'PR #{number} is closed, a draft, has a different head than `{expected}`, or no longer has the `needs-hosted-staging` label.'
                  summary.write(f'Staging skipped before deployment: {reason} The latest PR run owns staging.\n')
              if skip_reason:
                  raise SystemExit(1)
          PY
      - name: Deploy PR merge commit using the trusted legacy script
        if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && steps.staging-final-preflight.outputs.current == 'true'
        env:
          RENDER_STAGING_API_KEY: ${{ secrets.RENDER_STAGING_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
          SECRETARY_STAGING_DB_HOST: ${{ vars.SECRETARY_STAGING_DB_HOST }}
          SECRETARY_PRODUCTION_DB_HOST: ${{ vars.SECRETARY_PRODUCTION_DB_HOST }}
          STAGING_COMMIT: ${{ github.sha }}
        run: python scripts/deploy_staging.py
      - name: Verify legacy hosted API integration
        if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && steps.staging-final-preflight.outputs.current == 'true'
        run: node scripts/staging_smoke.mjs
      - name: Check out the exact-head synthetic acceptance runner and blob client
        if: steps.staging-final-preflight.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-source
          persist-credentials: false
          sparse-checkout: |
            package.json
            extension/js/api.js
            scripts/verify_crud.mjs
            scripts/secretary/github_api.py
          sparse-checkout-cone-mode: false
      - name: Verify saved report synthetic AI and CRUD checklist
        if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && steps.staging-final-preflight.outputs.current == 'true'
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          STAGING_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p output/hosted-staging
          node pr-source/scripts/verify_crud.mjs \
            --base-url "$STAGING_BASE_URL" --environment staging \
            --expected-sha "$STAGING_EXPECTED_SHA" --allow-writes \
            | tee output/hosted-staging/saved-report-crud.json
      - name: Verify deployed merge identity and package staging assets
        id: staging-finalize
        if: steps.staging-final-preflight.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_COMMIT: ${{ github.sha }}
          STAGING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_PR: ${{ github.event.pull_request.number }}
          STAGING_MIGRATION_REVISION: ${{ needs.backend.outputs.migration_revision }}
        run: |
          python - <<'PY'
          import datetime as dt
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path
          from scripts.secretary.preview import package, smoke

          helper_path = Path('pr-source/scripts/secretary/github_api.py')
          helper_spec = importlib.util.spec_from_file_location('staging_github_api', helper_path)
          if helper_spec is None or helper_spec.loader is None:
              raise RuntimeError('Could not load the bounded GitHub blob client')
          helper = importlib.util.module_from_spec(helper_spec)
          helper_spec.loader.exec_module(helper)
          APIError = helper.APIError
          GitHub = helper.GitHub

          config = json.loads(Path('.github/secretary.json').read_text())
          if os.environ['STAGING_BASE_URL'].rstrip('/') != config['staging_origin']:
              raise RuntimeError('Hosted smoke and extension must use the configured staging origin')
          deploy_sha = os.environ['STAGING_COMMIT']
          pr_head_sha = os.environ['STAGING_PR_HEAD_SHA']
          number = int(os.environ['STAGING_PR'])
          api = GitHub()
          output = Path('output/hosted-staging')
          def stop_without_artifact(reason):
              print(f'Hosted staging stopped: {reason}', file=sys.stderr)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as result:
                  result.write('current=false\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'Hosted staging for PR #{number} stopped safely: {reason} No extension artifact was published.\n')
              return True

          def superseded():
              try:
                  current = api.request(f'pulls/{number}')
              except APIError as error:
                  stop_without_artifact(f'GitHub could not confirm the current PR head ({error}).')
                  raise SystemExit(1)
              # github.sha may be the synthetic merge commit; only compare the live
              # PR head with the PR head captured when this run was queued.
              if (current['state'] == 'open' and current['head']['sha'] == pr_head_sha
                      and not current.get('draft', False)):
                  return False
              return stop_without_artifact('The PR closed, became a draft, or its head changed during deployment.')
          if superseded():
              raise SystemExit(0)
          evidence = smoke(config['staging_origin'], deploy_sha)
          crud = json.loads((output / 'saved-report-crud.json').read_text())
          provenance = crud.get('analysisProvenance')
          provider_mode = provenance.get('providerMode') if isinstance(provenance, dict) else None
          analysis_mode = crud.get('analysisMode')
          valid_provenance = (
              analysis_mode == 'mock' and provider_mode == 'mock'
          ) or (
              analysis_mode == 'real' and provider_mode in {'gemini', 'local', 'tfidf'}
          )
          if (crud.get('result') != 'passed' or crud.get('cleanedUp') is not True
                  or not valid_provenance):
              raise RuntimeError('The staging CRUD check requires consistent provider provenance and confirmed cleanup.')
          if superseded():
              raise SystemExit(0)
          try:
              package(api, deploy_sha, number, config, output / 'PhishLens-Staging-Extension.zip')
          except APIError as error:
              stop_without_artifact(f'GitHub could not package the current PR source ({error}).')
              raise SystemExit(1)
          if superseded():
              raise SystemExit(0)
          evidence.update({
              'pr': number, 'sha': pr_head_sha, 'deployed_commit': deploy_sha,
              'migration_revision': os.environ['STAGING_MIGRATION_REVISION'],
              'recorded_at': dt.datetime.now(dt.UTC).isoformat(),
              'automated_checklist': {
              'saved_report_crud': {
                      'result': 'passed',
                      'analysis_mode': crud['analysisMode'],
                  'provider_mode': provider_mode,
                  'cleaned_up': crud['cleanedUp'],
              },
              'real_ai_acceptance': {
                  'result': 'passed' if analysis_mode == 'real' else 'not_verified',
                  'analysis_mode': analysis_mode,
                  'provider_mode': provider_mode,
                      'model': crud['analysisProvenance']['model'],
                      'model_revision': crud['analysisProvenance']['modelRevision'],
                      'prompt_version': crud['analysisProvenance']['promptVersion'],
                  },
                  'packaged_extension_browser': {
                      'result': 'passed',
                      'source_commit': pr_head_sha,
                      'tested_commit': deploy_sha,
                      'artifact': 'Extension-Browser-Acceptance',
                  },
              },
          })
          (output / 'evidence.json').write_text(json.dumps(evidence, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as result:
              result.write('current=true\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Hosted staging verified for PR #{number} head `{pr_head_sha}` using merge commit `{deploy_sha}` and Alembic revision `{os.environ["STAGING_MIGRATION_REVISION"]}`.\n\n')
              summary.write('- [x] Health, readiness, version, seeded history, and staging package passed.\n')
              summary.write(f"- [x] Synthetic saved-report CRUD/provenance passed (`{provider_mode}` provider; record cleaned up).\n")
              if analysis_mode == 'real':
                  summary.write(f"- [x] Non-mock AI acceptance passed with `{provider_mode}`.\n")
              else:
                  summary.write('- [ ] Real AI acceptance is not checked: staging used `mock`. Mock output is not AI acceptance.\n')
              summary.write(f'- [x] Packaged extension browser checklist passed for `{pr_head_sha}` in `Extension-Browser-Acceptance` (tested checkout `{deploy_sha}`).\n')
          PY
      - name: Preserve hosted staging evidence and extension
        if: steps.staging-finalize.outputs.current == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PhishLens-Staging-Extension
          path: output/hosted-staging/
          if-no-files-found: error
          retention-days: 7


