          PREFLIGHT_CURRENT: ${{ needs.hosted-staging-preflight.outputs.current }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MIGRATION_REVISION: ${{ needs.backend.outputs.hosted_migration_revision }}
        run: |
          python - <<'PY'
