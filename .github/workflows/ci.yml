          PRODUCTION_NEON_PROJECT_ID: ${{ vars.PRODUCTION_NEON_PROJECT_ID }}
          PRODUCTION_NEON_EXPECTED_HOST: ${{ vars.PRODUCTION_NEON_EXPECTED_HOST }}
        run: |
          python - <<'PY'
          import json, os, re
          from urllib.parse import urlsplit
          import psycopg
          from psycopg.conninfo import conninfo_to_dict
          from scripts.secretary.preview import render_request, verify_environment, verify_service
          config = json.loads(open('.github/secretary.json', encoding='utf-8').read())
          service_id = os.environ['RENDER_STAGING_SERVICE_ID']
          if service_id != config['staging_service'] or service_id == config['production_service']:
              raise SystemExit('Hosted staging is not the allowlisted Render staging service.')
          service = render_request(f'services/{service_id}')
          verify_service(service, config)
          rows = render_request(f'services/{service_id}/env-vars?limit=100')
          report_auth_mode = verify_environment(rows, require_authenticated=True)
          values = {row['envVar']['key']: row['envVar']['value'] for row in rows}
          def normalized(host):
              return re.sub(r'-pooler(?=\.)', '', host.strip().rstrip('.').lower())
          expected = {
              'STAGING_NEON_BRANCH_ID': os.environ['STAGING_NEON_BRANCH_ID'],
              'STAGING_NEON_PROJECT_ID': os.environ['STAGING_NEON_PROJECT_ID'],
              'PRODUCTION_NEON_BRANCH_ID': os.environ['PRODUCTION_NEON_BRANCH_ID'],
              'PRODUCTION_NEON_PROJECT_ID': os.environ['PRODUCTION_NEON_PROJECT_ID'],
          }
          for key, value in expected.items():
              if values.get(key) != value:
                  raise SystemExit(f'Render staging {key} does not match the verified Neon branch.')
          for key in ('STAGING_NEON_EXPECTED_HOST', 'STAGING_DATABASE_HOST', 'PRODUCTION_NEON_EXPECTED_HOST'):
              if not values.get(key):
                  raise SystemExit(f'Render staging is missing required branch mapping setting {key}.')
          if normalized(values['STAGING_NEON_EXPECTED_HOST']) != normalized(os.environ['STAGING_NEON_EXPECTED_HOST']):
              raise SystemExit('Render staging Neon host does not match the verified branch endpoint.')
          if normalized(values['STAGING_DATABASE_HOST']) != normalized(os.environ['STAGING_NEON_EXPECTED_HOST']):
              raise SystemExit('Render staging runtime host does not match the verified Neon branch endpoint.')
          if normalized(values['PRODUCTION_NEON_EXPECTED_HOST']) != normalized(os.environ['PRODUCTION_NEON_EXPECTED_HOST']):
              raise SystemExit('Render staging production-host guard does not match the production allowlist.')
          if report_auth_mode != 'neon':
              raise SystemExit('Hosted staging requires Neon Auth before any deployment.')
          # Read the stamp with the restricted runtime role. Keep the DSN in
          # this step and pass only the validated revision to the candidate.
          try:
              uri = values['DATABASE_URL'].replace('postgresql+psycopg://', 'postgresql://', 1)
              connection = conninfo_to_dict(uri)
              permitted = {'host', 'port', 'dbname', 'user', 'password', 'sslmode', 'channel_binding'}
              if (connection.keys() - permitted
                      or connection.get('host') != urlsplit(uri).hostname
                      or normalized(connection.get('host', '')) != normalized(os.environ['STAGING_NEON_EXPECTED_HOST'])
                      or connection.get('port', '5432') != '5432'
                      or connection.get('dbname') != 'phishlens_dev'
                      or connection.get('user') != 'phishlens_staging_app'
                      or connection.get('sslmode', 'require') not in {'require', 'verify-ca', 'verify-full'}):
                  raise ValueError('Unexpected staging database connection parameters')
              connection.setdefault('sslmode', 'require')
              with psycopg.connect(**connection, connect_timeout=8) as db:
                  db.read_only = True
                  db.execute('SET LOCAL statement_timeout = 5000')
                  stamps = db.execute('SELECT version_num FROM public.alembic_version LIMIT 2').fetchall()
          except (KeyError, ValueError, OSError, psycopg.Error):
              raise SystemExit('Cannot read the staging database migration revision safely; deployment blocked.') from None
          if len(stamps) != 1 or not isinstance(stamps[0][0], str) or not re.fullmatch(r'[A-Za-z0-9_]{1,32}', stamps[0][0]):
              raise SystemExit('Expected one valid staging database migration revision; deployment blocked.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'applied_revision={stamps[0][0]}\n')
          print('Render staging is privately mapped to the verified isolated branch and Neon Auth.')
          PY

      - name: Verify candidate can upgrade the applied staging revision
