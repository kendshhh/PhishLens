      - name: Verify PR-head identity and package staging assets
        id: staging-finalize
        if: steps.staging-deploy-preflight.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_COMMIT: ${{ github.event.pull_request.head.sha }}
          STAGING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAGING_PR: ${{ github.event.pull_request.number }}
          STAGING_MIGRATION_REVISION: ${{ needs.backend.outputs.hosted_migration_revision }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          import urllib.request
          from pathlib import Path
          from scripts.deploy_staging import live_pr_matches, requested_pr_identity
          from scripts.secretary.github_api import APIError, ReadOnlyGitHub
          from scripts.secretary.preview import package, smoke

          config = json.loads(Path('.github/secretary.json').read_text())
          if os.environ['STAGING_BASE_URL'].rstrip('/') != config['staging_origin']:
              raise RuntimeError('Hosted smoke and extension must use the configured staging origin')
          number, pr_head_sha = requested_pr_identity()
          deploy_sha = os.environ['STAGING_COMMIT']
          if deploy_sha != pr_head_sha:
              raise RuntimeError('The deployed commit is not the exact requested PR head')
          repository = os.environ['GITHUB_REPOSITORY']
          api = ReadOnlyGitHub(
              repo=repository,
              token=os.environ.get('GITHUB_TOKEN', ''),
          )
          output = Path('output/hosted-staging')
          output.mkdir(parents=True, exist_ok=True)
          def stop_without_artifact(reason):
              print(f'Hosted staging stopped: {reason}', file=sys.stderr)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as result:
                  result.write('current=false\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'Hosted staging for PR #{number} stopped safely: {reason} No extension artifact was published.\n')
              return True

          def superseded():
              try:
                  current = api.request(f'pulls/{number}')
              except APIError as error:
                  stop_without_artifact(f'GitHub could not confirm the current PR head ({error}).')
                  raise SystemExit(1)
              if live_pr_matches(current, number, pr_head_sha, repository):
                  return False
              return stop_without_artifact('The PR closed, became a draft, lost staging eligibility, changed repository, or advanced its head during deployment.')
          if superseded():
              raise SystemExit(0)
          evidence = smoke(config['staging_origin'], deploy_sha, report_auth_mode='neon')
          bridge_origin = config['staging_origin'].rstrip('/')
          extension_origin = 'chrome-extension://ceneonaedddlkdocdapimkfggbjcchlb'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  return None
          bridge_opener = urllib.request.build_opener(NoRedirect)
          bridge_checks = {}
          for path, content_type in (
              ('/auth/bridge', 'text/html'),
              ('/auth/bridge/client.js', 'javascript'),
              ('/auth/bridge/sdk.mjs', 'javascript'),
          ):
              request = urllib.request.Request(
                  bridge_origin + path, headers={'Cache-Control': 'no-cache'}
              )
              try:
                  with bridge_opener.open(request, timeout=20) as response:
                      actual_type = response.headers.get('Content-Type', '').lower()
                      if response.status != 200 or response.geturl() != bridge_origin + path:
                          raise RuntimeError('unexpected response')
                      if content_type not in actual_type:
                          raise RuntimeError('unexpected content type')
                      if path == '/auth/bridge':
                          if 'frame-ancestors ' + extension_origin not in response.headers.get('Content-Security-Policy', ''):
                              raise RuntimeError('extension origin is not frame-allowed')
                          body = response.read(65537).decode('utf-8', errors='replace')
                          if len(body) > 65536 or 'data-extension-origin="' + extension_origin + '"' not in body:
                              raise RuntimeError('bridge document does not bind the expected extension')
                      bridge_checks[path] = 200
              except Exception:  # noqa: BLE001 -- report only the bounded check result
                  raise RuntimeError('Staging Auth bridge GET failed: ' + path) from None
          evidence['auth_bridge'] = bridge_checks
          if superseded():
              raise SystemExit(0)
          try:
              package(api, deploy_sha, number, config, output / 'PhishLens-Staging-Extension.zip')
          except APIError as error:
              stop_without_artifact(f'GitHub could not package the current PR source ({error}).')
              raise SystemExit(1)
          if superseded():
              raise SystemExit(0)
          evidence.update({
              'pr': number, 'sha': pr_head_sha, 'deployed_commit': deploy_sha,
              'migration_revision': os.environ['STAGING_MIGRATION_REVISION'],
              'recorded_at': dt.datetime.now(dt.UTC).isoformat(),
              'automated_checklist': {
                  'read_only_preflight': {
                      'result': 'passed',
                      'auth_bridge': 'passed',
                      'anonymous_saved_report': 'authentication_required',
                      'seeded_history': 'not_checked',
                      'application_crud_writes_performed': False,
                  },
                  'live_auth_acceptance': {'result': 'not_run'},
                  'saved_report_crud': {'result': 'not_run'},
                  'packaged_extension_browser': {
                      'result': 'passed',
                      'source_commit': pr_head_sha,
                      'tested_commit': deploy_sha,
                      'artifact': 'Extension-Browser-Acceptance',
                  },
              },
          })
          (output / 'evidence.json').write_text(json.dumps(evidence, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as result:
              result.write('current=true\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Hosted staging read-only preflight passed for PR #{number} head `{pr_head_sha}` at exact deployed commit `{deploy_sha}`.\n\n')
              summary.write('- [x] Health, readiness, exact version, Auth bridge assets, and anonymous Bearer challenge passed.\n')
              summary.write('- [ ] Seeded history was not checked.\n')
              summary.write('- [ ] Sign-up, email delivery, session behavior, authenticated history, and CRUD were not run; no account or saved-report writes were performed.\n')
              summary.write('- [ ] Deployment and migrations are separate staging operations; this endpoint preflight uses GET requests only.\n')
              summary.write(f'- [x] Packaged extension browser checklist passed for `{pr_head_sha}` in `Extension-Browser-Acceptance` (tested checkout `{deploy_sha}`).\n')
          PY
      - name: Recheck live PR head before authenticated acceptance
