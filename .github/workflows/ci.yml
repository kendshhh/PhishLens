          staging = normalized(os.environ['STAGING_NEON_EXPECTED_HOST'])
          render_staging = normalized(os.environ['SECRETARY_STAGING_DB_HOST'])
          production = normalized(os.environ['PRODUCTION_NEON_EXPECTED_HOST'])
          render_production = normalized(os.environ['SECRETARY_PRODUCTION_DB_HOST'])
          if os.environ['STAGING_NEON_PROJECT_ID'] == os.environ['PRODUCTION_NEON_PROJECT_ID']:
