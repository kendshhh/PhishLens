          checks = {
              'Staging integration': os.environ.get('STAGING_INTEGRATION_RESULT'),
              'Hosted staging preflight': os.environ.get('PREFLIGHT_RESULT'),
              'current PR head': os.environ.get('PREFLIGHT_CURRENT'),
              'Backend checks': os.environ.get('BACKEND_RESULT'),
          }
          failures = [f'{name}={value}' for name, value in checks.items()
                      if value != ('true' if name == 'current PR head' else 'success')]
          if not os.environ.get('MIGRATION_REVISION', '').strip():
              failures.append('backend migration revision is missing')
          if failures:
              raise SystemExit('Hosted staging prerequisites failed: ' + ', '.join(failures))
