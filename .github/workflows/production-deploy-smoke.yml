name: Production deployment smoke

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full source SHA deployed to production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy-smoke-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    name: Verify deployed production behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Check out the trusted smoke verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Wait for exact production SHA and verify safe behavior
        run: python -m scripts.production_deploy_smoke --expected-sha "$EXPECTED_SOURCE_SHA"

      - name: Preserve redacted smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Production-deploy-smoke-${{ env.EXPECTED_SOURCE_SHA }}
          path: output/production-smoke/summary.json
          if-no-files-found: warn
          retention-days: 90
