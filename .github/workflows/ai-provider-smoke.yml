name: AI provider staging smoke

on:
  workflow_dispatch:
    inputs:
      enable_live_provider_request:
        description: "Explicitly allow one synthetic provider request after protected staging approval"
        required: true
        type: boolean
        default: false
      expected_source_sha:
        description: "Full 40-character SHA currently reported by staging /version"
        required: true
        type: string

permissions:
  contents: read

jobs:
  staging-smoke:
    if: github.ref == 'refs/heads/main' && inputs.enable_live_provider_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    concurrency:
      group: phishlens-ai-provider-smoke
      cancel-in-progress: false
    steps:
      - name: Check out reviewed default-branch controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Check exact staging identity and run one bounded request
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          AI_PROVIDER_SMOKE_ENABLE_REQUEST: ${{ inputs.enable_live_provider_request }}
          AI_PROVIDER_SMOKE_ENV: staging
          AI_PROVIDER_SMOKE_ENABLED: ${{ vars.AI_PROVIDER_SMOKE_ENABLED }}
          AI_PROVIDER_SMOKE_PROVIDER: ${{ vars.AI_PROVIDER_SMOKE_PROVIDER }}
          AI_PROVIDER_SMOKE_MODEL: ${{ vars.AI_PROVIDER_SMOKE_MODEL }}
          AI_PROVIDER_SMOKE_MAX_REQUESTS: ${{ vars.AI_PROVIDER_SMOKE_MAX_REQUESTS }}
          AI_PROVIDER_SMOKE_COST_CAP_USD: ${{ vars.AI_PROVIDER_SMOKE_COST_CAP_USD }}
          AI_PROVIDER_SMOKE_PROVIDER_BUDGET_ENFORCED: ${{ vars.AI_PROVIDER_SMOKE_PROVIDER_BUDGET_ENFORCED }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: python scripts/ai_provider_smoke.py

      - name: Preserve redacted smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AI-Provider-Smoke-Evidence
          path: output/ai-provider-smoke/summary.json
          if-no-files-found: warn
          retention-days: 7

