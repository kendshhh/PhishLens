protocol: academic_pilot_v2
seed: 42
inference: local_only
data:
  train_archive: C:/Users/ACER/Downloads/TestDatasets/Trainset.zip
  ood_selection: D:\Phishlens\PhishLens\benchmarks\local_email\data\dataset_selection.json
  split_fractions:
  - 0.7
  - 0.15
  - 0.15
  validation_targets:
    0: 1000
    1: 1000
  test_targets:
    0: 500
    1: 500
  minimum_val_legitimate: 1000
  near_duplicates:
    method: exact_word_5gram_jaccard_prefix_filter_global_frequency_order
    threshold: 0.9
    min_words: 12
    text_field: prepared_model_input
  consistency_validation_samples: 50
  consistency_repeats: 5
  adversarial_holdout: deferred_not_assessed
preprocessing:
  html: visible_text_and_link_targets_no_execution
  whitespace: collapse
  unicode: preserve_confusables_zero_width_and_bidi
  max_characters: 2300
  head_characters: 2000
  tail_characters: 300
  character_unit: unicode_code_points
models:
  tfidf_lr:
    kind: tfidf_lr
    word_ngram_range:
    - 1
    - 2
    max_features: 18000
    min_df: 2
    sublinear_tf: true
    C: 1.0
    max_iter: 1000
    class_weight: null
  distilbert:
    kind: onnx_classifier
    model_id: onnx-community/phishing-email-detection-distilbert_v2.4.1-ONNX
    revision: d2a92d9e2830eddb1c4600adc3c04f8b577e6597
    artifact: onnx/model_quantized.onnx
    phishing_indices:
    - 1
    - 3
    legitimate_indices:
    - 0
    - 2
    label_evidence: https://huggingface.co/cybersectony/phishing-email-detection-distilbert_v2.4.1
    max_tokens: 512
    chunk_aggregation: maximum_phishing_probability_over_nonoverlapping_content_windows
  llm:
    kind: onnx_causal_lm
    model_id: onnx-community/Llama-3.2-1B-Instruct-ONNX
    revision: 14007543b6dc92de88daf96a9aa85d2f95ace6ef
    artifact: onnx/model_q4f16.onnx
    temperature: 0
    runtime_seed: 42
    repeats: 5
    max_new_tokens: 128
    confidence_semantics: probability_of_phishing_not_certainty_of_predicted_label
    local_directory: llama
evaluation:
  primary_validation_fpr_target: 0.02
  likely_phishing_validation_fpr_target: 0.005
  threshold_rule: lowest_threshold_with_empirical_fpr_at_or_below_target_predictions_use_greater_or_equal
  invalid_output:
    verdict: safe
    probability: 0.0
    valid: false
  test_scoring_passes: 1
  bootstrap:
    replicates: 2000
    confidence: 0.95
    sampling: stratified_by_class_and_duplicate_group
  ece:
    bins: 10
    binning: equal_width
    probability: phishing
  pr_auc: average_precision
  consistency: fraction_of_items_with_valid_identical_labels_across_all_five_repeats
  mcnemar:
    method: exact_binomial_two_sided
    alpha: 0.05
    correction: holm
  gate_statistic: point_estimate_with_confidence_intervals_reported
browser:
  transformers_js: 4.3.1
  preferred_backends:
    tfidf_lr: javascript_cpu
    distilbert: wasm
    llm: webgpu
  warmups: 10
  timed_emails: 100
  cold_trials: 3
  cpu_throttle: 1
  performance_scope: one_declared_configuration_per_model_on_same_computer
llm_generation:
  temperature: 0
  do_sample: false
  seed: 42
  max_new_tokens: 128
  seed_note: record_native_seed_support; greedy_decoder_and_page_PRNG_seeded; no_claim_of_native_seed_if_unavailable
  output_constraint:
    package: '@huggingface/transformers-structured-output'
    version: 4.3.1
    format:
      type: json_schema
      json_schema:
        type: object
        properties:
          label:
            type: integer
            enum:
            - 0
            - 1
          confidence:
            type: number
            minimum: 0
            maximum: 1
          reason:
            type: string
            minLength: 1
            maxLength: 160
        required:
        - label
        - confidence
        - reason
        additionalProperties: false
human_review:
  samples: 30
  borderline_inclusive:
  - 0.4
  - 0.7
  fast_model: tfidf_lr
  sampling_seed: 42
decision:
  type: descriptive_comparison_with_uncertainty
  full_protocol_gates: not_assessed
  weighted_ranking: deferred
  model_training_contamination: disclosed_sources_checked_inaccessible_corpora_unknown
approved_scope: Noncommercial academic research; smaller academic pilot approved by
  user
